<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- First-paint loader styles. Inline so the branded loading screen shows
         instantly, before the JS bundle has been downloaded/parsed. Mirrors
         src/BrandLoader.jsx so the hand-off from HTML → React is seamless. -->
    <style>
      #root .boot {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 0 1.5rem;
        background: linear-gradient(160deg, #1e1b5a 0%, #4338ca 35%, #7c3aed 65%, #be185d 100%);
      }
      #root .boot-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 4rem;
        height: 4rem;
      }
      #root .boot-mark img {
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 0.85rem;
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.28);
      }
      #root .boot-mark-ring {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 3px solid rgba(255, 255, 255, 0.6);
        border-top-color: transparent;
        animation: bootspin 1s linear infinite;
      }
      #root .boot-name {
        margin: 0;
        color: rgba(255, 255, 255, 0.9);
        font: 800 0.875rem/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.25em;
        text-transform: uppercase;
      }
      @keyframes bootspin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #root .boot-mark-ring { animation-duration: 2s; }
      }
    </style>

   <meta name="google-site-verification" content="pZnVXIUGdveKL-trd_h_SMHMYbCNoVxgvb70ozM1iYQ" />

    <title>EZ Wonders | Interactive Numeracy Games for Kindergarten (K1 & K2)</title>
    <meta
      name="description"
      content="Free interactive numeracy games for Kindergarten children aged 4-6. Counting, comparing quantities, subitising, number bonds and number order — suits Singapore K1 and K2 classes, Reception, Pre-K and home learning."
    />
    <meta
      name="keywords"
      content="interactive numeracy games for kindergarten, kindergarten maths games Singapore, K1 K2 numeracy games, preschool number games, number bonds games, counting games for 5 year olds, subitising games, part-part-whole games, free early years maths games, EZ Wonders"
    />

    <meta name="application-name" content="EZ Wonders" />
    <meta name="author" content="EZ Wonders" />

    <!-- Installability / standalone meta.
         Split theme-color: the browser chrome tint follows the OS colour
         scheme, matching the app's aurora-dusk backdrop (deep indigo) instead
         of the old single light-sky value, which tinted the status bar a
         colour the app never actually renders behind it. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#3fb6ea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e1b5a" />
    <!-- Android Chrome reads this to launch without browser chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS Safari uses the apple-* variants; it ignores the manifest for these.
         black-translucent lets the app paint under the status bar, which the
         full-bleed aurora backdrop handles correctly. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EZ Wonders" />

    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="canonical" href="https://ezwonders.com/" />

    <!-- Pre-connect to the API server so the TLS handshake finishes before
         React even mounts. Saves ~100-300ms on the first fetch for every
         session — the "Loading your class games…" spinner disappears faster. -->
    <link rel="dns-prefetch" href="https://k1weekly-server.onrender.com" />
    <link rel="preconnect" href="https://k1weekly-server.onrender.com" crossorigin />

    <!-- Fredoka is the brand font, used for every heading in the app.
         It MUST be requested here rather than from inside a React component:
         when it lived in BetaHome's JSX the request could not start until that
         lazy chunk had downloaded AND executed, so the font competed with the
         page for a round trip and text visibly re-flowed on arrival. Declared
         in the HTML shell it downloads in parallel with the JS bundle.
         `display=swap` keeps first paint on the fallback face. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800;900&display=swap"
    />

    <!-- Favicon / app icon set, all generated from the brand icon.
         Google's search-result favicon crawler requires a square icon and
         prefers sizes that are a multiple of 48px, so 48/96/192 are declared
         explicitly. A real /favicon.ico is also kept at the site root because
         that is the path the crawler probes when it finds no usable link tag. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
