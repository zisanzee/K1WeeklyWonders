name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is the contract, and a
      # CI run that silently resolves a different tree can pass here and fail
      # on a deploy that does use it.
      - run: npm ci

      # Supply-chain gate. The auth credential lives in localStorage, so a
      # vulnerable dependency is an exfil path, not an abstract concern.
      #
      # BLOCKING: the pre-existing high/critical backlog was cleared on
      # 2026-09-25 (`npm audit` reports 0 vulnerabilities), so a new high now
      # fails the build rather than scrolling past.
      - run: npm audit --audit-level=high

      - run: npm run lint

      - run: npm test

      # The build is deliberately last and is not redundant with the two above:
      # Vite 8 + rolldown fails on config shapes (e.g. an object-form
      # manualChunks) that neither lint nor the unit tests would ever load.
      - run: npm run build
