# Dependabot — keeps dependencies patched so the CI supply-chain gate
# (`npm audit --audit-level=high`) does not fail on newly-disclosed advisories
# in transitive packages.
#
# WHY THIS EXISTS: a CI failure on 2026-09-30 came from two TRANSITIVE deps
# (brace-expansion via filelist, and fast-uri) that nobody edited directly —
# an advisory landed and CI started failing with no code change. Weekly
# version updates + Dependabot security updates mean the fix arrives as a PR
# before/alongside any CI failure, and never as a surprise.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 6
    # Group bumps so "future games added" does not mean a pile of PRs: minor and
    # patch updates land as one PR each, majors stay separate so a breaking
    # change is reviewed on its own.
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # Keep the CI actions themselves current (both are currently on v4; a stale
  # action is its own supply-chain surface).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
